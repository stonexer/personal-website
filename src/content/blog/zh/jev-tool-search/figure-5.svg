<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="title"><title id="title">指定平台没有，替代工具要不要给</title>
<rect width="640" height="100%" fill="#faf9f6"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#292824">
<text x="28" y="45" font-size="24" font-weight="600">指定平台没有，替代工具要不要给</text>
<rect x="28" y="80" width="584" height="100" rx="5" fill="#eeede8"/>
<text x="46" y="107" font-size="16" fill="#45443f" font-weight="600">查询</text>
<text x="46" y="136" font-size="22">在 hh.ru 上找职位</text>
<text x="46" y="162" font-size="18" fill="#65635c">当时目录没有对应平台的工具。</text>
<rect x="28" y="198" width="584" height="100" rx="5" fill="#e6eeea"/>
<text x="46" y="225" font-size="16" fill="#30594a" font-weight="600">Jev · 严格匹配</text>
<text x="46" y="254" font-size="22">没有候选被保留</text>
<text x="46" y="280" font-size="18" fill="#65635c">其他来源不能直接满足指定平台的要求。</text>
<rect x="28" y="316" width="584" height="100" rx="5" fill="#f0e8db"/>
<text x="46" y="343" font-size="16" fill="#77572c" font-weight="600">词法 · 相近能力</text>
<text x="46" y="372" font-size="22">返回通用职位搜索</text>
<text x="46" y="398" font-size="18" fill="#65635c">agent 最后调用了它，这次记分归词法。</text>
<text x="28" y="475" font-size="17" fill="#65635c">替代工具被采用，还不能说明任务已经完成。</text>
</g></svg>