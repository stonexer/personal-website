<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 638" role="img" aria-labelledby="title"><title id="title">先召回，再判断，最后排序</title>
<rect width="640" height="100%" fill="#faf9f6"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#292824">
<text x="28" y="45" font-size="24" font-weight="600">先召回，再判断，最后排序</text>
<rect x="28" y="80" width="584" height="100" rx="5" fill="#eeede8"/>
<text x="46" y="107" font-size="16" fill="#45443f" font-weight="600">01 · 放宽词法召回</text>
<text x="46" y="136" font-size="22">取前 30 个候选</text>
<text x="46" y="162" font-size="18" fill="#65635c">命中任意一个稀有词即可。</text>
<rect x="28" y="198" width="584" height="100" rx="5" fill="#e6eeea"/>
<text x="46" y="225" font-size="16" fill="#30594a" font-weight="600">02 · Jev 判断</text>
<text x="46" y="254" font-size="22">30 个问题，一次请求</text>
<text x="46" y="280" font-size="18" fill="#65635c">工具能否满足任务及平台、数据源要求？</text>
<rect x="28" y="316" width="584" height="100" rx="5" fill="#e6eeea"/>
<text x="46" y="343" font-size="16" fill="#30594a" font-weight="600">03 · 过滤和分组</text>
<text x="46" y="372" font-size="22">低于 0.4 丢弃，达到 0.7 优先</text>
<text x="46" y="398" font-size="18" fill="#65635c">组内保留词法顺序。</text>
<rect x="28" y="434" width="584" height="100" rx="5" fill="#f0e8db"/>
<text x="46" y="461" font-size="16" fill="#77572c" font-weight="600">回退</text>
<text x="46" y="490" font-size="22">返回原词法结果</text>
<text x="46" y="516" font-size="18" fill="#65635c">判断超时、报错或未配置时使用。</text>
<text x="28" y="593" font-size="17" fill="#65635c">原有的实测成功率和价格排序规则继续生效。</text>
</g></svg>