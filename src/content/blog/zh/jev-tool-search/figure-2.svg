<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="title"><title id="title">任务细节，为什么成了搜索的障碍</title>
<rect width="640" height="100%" fill="#faf9f6"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#292824">
<text x="28" y="45" font-size="24" font-weight="600">任务细节，为什么成了搜索的障碍</text>
<rect x="28" y="80" width="584" height="100" rx="5" fill="#eeede8"/>
<text x="46" y="107" font-size="16" fill="#45443f" font-weight="600">查询</text>
<text x="46" y="136" font-size="22">apple stock closing prices for last year</text>
<text x="46" y="162" font-size="18" fill="#65635c">股票、价格类型和时间范围。</text>
<rect x="28" y="198" width="584" height="100" rx="5" fill="#e6eeea"/>
<text x="46" y="225" font-size="16" fill="#30594a" font-weight="600">工具描述</text>
<text x="46" y="254" font-size="22">按 ticker 获取历史日线价格</text>
<text x="46" y="280" font-size="18" fill="#65635c">描述里不一定出现 Apple 或 last year。</text>
<rect x="28" y="316" width="584" height="100" rx="5" fill="#f0e8db"/>
<text x="46" y="343" font-size="16" fill="#77572c" font-weight="600">原词法门槛</text>
<text x="46" y="372" font-size="22">6 个稀有词，至少命中 4 个</text>
<text x="46" y="398" font-size="18" fill="#65635c">参数词也参与匹配，可能把相关工具过滤掉。</text>
<text x="28" y="475" font-size="17" fill="#65635c">具体股票和日期范围，通常在调用时通过参数指定。</text>
</g></svg>