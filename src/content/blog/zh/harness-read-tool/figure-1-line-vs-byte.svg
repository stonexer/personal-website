<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 268" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, monospace" font-size="11">
            <rect width="760" height="268" fill="#fff"/>

            <!-- column headers -->
            <g fill="#7a7a7a" font-size="10" text-anchor="middle">
              <text x="110" y="40">输入</text>
              <text x="305" y="40">行数限制</text>
              <text x="475" y="40">字节限制</text>
              <text x="665" y="40">结果</text>
            </g>

            <!-- arrowhead -->
            <defs>
              <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a92"/>
              </marker>
            </defs>

            <!-- Row 1: normal file -->
            <g>
              <rect x="40" y="66" width="140" height="46" fill="#eef4f8" stroke="#6f9bb8"/>
              <text x="110" y="86" text-anchor="middle" fill="#4a4a4a">普通文件</text>
              <text x="110" y="101" text-anchor="middle" fill="#7a7a7a" font-size="10">200 行 / 8 KB</text>

              <rect x="250" y="66" width="110" height="46" fill="#fff" stroke="#c5d4ba"/>
              <text x="305" y="86" text-anchor="middle" fill="#4a4a4a">≤ 100 行</text>
              <text x="305" y="101" text-anchor="middle" fill="#6b8862" font-size="11">✓ 截前 100 行</text>

              <rect x="420" y="66" width="130" height="46" fill="#fff" stroke="#c5d4ba"/>
              <text x="485" y="86" text-anchor="middle" fill="#4a4a4a">≤ 50 KB</text>
              <text x="485" y="101" text-anchor="middle" fill="#6b8862" font-size="11">✓ 8 KB 通过</text>

              <rect x="600" y="66" width="130" height="46" fill="#e3ecdf" stroke="#6b8862"/>
              <text x="665" y="93" text-anchor="middle" fill="#6b8862" font-weight="600">正常返回</text>

              <g stroke="#9a9a92" stroke-width="1.3" marker-end="url(#a1)">
                <line x1="180" y1="89" x2="248" y2="89"/>
                <line x1="360" y1="89" x2="418" y2="89"/>
                <line x1="550" y1="89" x2="598" y2="89"/>
              </g>
            </g>

            <!-- Row 2: single-line giant -->
            <g>
              <rect x="40" y="160" width="140" height="46" fill="#f5ecdc" stroke="#b88a4a"/>
              <text x="110" y="180" text-anchor="middle" fill="#7a6420">单行 532 KB</text>
              <text x="110" y="195" text-anchor="middle" fill="#7a7a7a" font-size="10">1 行 / 532 KB</text>

              <rect x="250" y="160" width="110" height="46" fill="#fff" stroke="#c5d4ba"/>
              <text x="305" y="180" text-anchor="middle" fill="#4a4a4a">≤ 100 行</text>
              <text x="305" y="195" text-anchor="middle" fill="#6b8862" font-size="11">✓ 只有 1 行</text>

              <rect x="420" y="160" width="130" height="46" fill="#fff" stroke="#d8b0a0"/>
              <text x="485" y="180" text-anchor="middle" fill="#4a4a4a">≤ 50 KB</text>
              <text x="485" y="195" text-anchor="middle" fill="#a05050" font-size="11">✗ 532 KB 超限</text>

              <rect x="600" y="160" width="130" height="46" fill="#f3e3e0" stroke="#a05050"/>
              <text x="665" y="181" text-anchor="middle" fill="#a05050" font-weight="600">拒绝返回</text>
              <text x="665" y="196" text-anchor="middle" fill="#a05050" font-size="9.5">建议分段读取</text>

              <g stroke="#9a9a92" stroke-width="1.3" marker-end="url(#a1)">
                <line x1="180" y1="183" x2="248" y2="183"/>
                <line x1="360" y1="183" x2="418" y2="183"/>
              </g>
              <line x1="550" y1="183" x2="598" y2="183" stroke="#a05050" stroke-width="1.3" marker-end="url(#a1)"/>
            </g>

            <text x="40" y="246" fill="#7a7a7a" font-size="10.5">行数限制通过，不代表输出预算安全 —— 行、字节、总输出，每道边界都得各自设限。</text>
          </svg>
