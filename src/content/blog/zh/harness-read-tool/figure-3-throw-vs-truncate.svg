<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, monospace" font-size="11">
            <rect width="760" height="280" fill="#fff"/>

            <line x1="180" y1="40" x2="180" y2="220" stroke="#7a7a7a"/>
            <line x1="180" y1="220" x2="700" y2="220" stroke="#7a7a7a"/>

            <g fill="#7a7a7a" font-size="10" text-anchor="end">
              <text x="170" y="224">0</text>
              <text x="170" y="190">5K</text>
              <text x="170" y="155">10K</text>
              <text x="170" y="120">15K</text>
              <text x="170" y="86">20K</text>
              <text x="170" y="50">25K</text>
            </g>
            <g stroke="#e8e8e2" stroke-width="1" stroke-dasharray="2 4">
              <line x1="180" y1="190" x2="700" y2="190"/>
              <line x1="180" y1="155" x2="700" y2="155"/>
              <line x1="180" y1="120" x2="700" y2="120"/>
              <line x1="180" y1="86" x2="700" y2="86"/>
              <line x1="180" y1="50" x2="700" y2="50"/>
            </g>

            <text x="60" y="130" fill="#4a4a4a" font-size="11" transform="rotate(-90 60 130)" text-anchor="middle">tokens 返回（估）</text>

            <g>
              <rect x="240" y="217" width="80" height="3" fill="#e3ecdf" stroke="#6b8862"/>
              <text x="280" y="210" text-anchor="middle" fill="#6b8862" font-size="11" font-weight="600">~25 tokens</text>
              <text x="280" y="242" text-anchor="middle" fill="#4a4a4a" font-size="11">throw（报错）</text>
              <text x="280" y="258" text-anchor="middle" fill="#7a7a7a" font-size="10">让模型立刻换策略</text>
            </g>

            <g>
              <rect x="440" y="50" width="80" height="170" fill="#f5ecdc" stroke="#b88a4a"/>
              <text x="480" y="44" text-anchor="middle" fill="#b88a4a" font-size="11" font-weight="600">~25K tokens</text>
              <text x="480" y="242" text-anchor="middle" fill="#4a4a4a" font-size="11">truncate（截断返回）</text>
              <text x="480" y="258" text-anchor="middle" fill="#7a7a7a" font-size="10">很可能仍要再读一次</text>
            </g>

            <g transform="translate(580, 110)">
              <text x="0" y="0" fill="#a05050" font-weight="600" font-size="14">两个数量级以上</text>
              <text x="0" y="18" fill="#7a7a7a" font-size="10">同一次失败读取</text>
              <text x="0" y="32" fill="#7a7a7a" font-size="10">的返回体量差距</text>
            </g>

            <text x="430" y="30" fill="#4a4a4a" font-size="11" font-weight="600">A/B #21841 · 最终改回 throw</text>
          </svg>
