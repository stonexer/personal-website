<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="title"><title id="title">When task details get in the way</title>
<rect width="640" height="100%" fill="#faf9f6"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#292824">
<text x="28" y="45" font-size="24" font-weight="600">When task details get in the way</text>
<rect x="28" y="80" width="584" height="100" rx="5" fill="#eeede8"/>
<text x="46" y="107" font-size="16" fill="#45443f" font-weight="600">Query</text>
<text x="46" y="136" font-size="22">apple stock closing prices for last year</text>
<text x="46" y="162" font-size="18" fill="#65635c">A stock, a price type, and a time range.</text>
<rect x="28" y="198" width="584" height="100" rx="5" fill="#e6eeea"/>
<text x="46" y="225" font-size="16" fill="#30594a" font-weight="600">Tool description</text>
<text x="46" y="254" font-size="22">Daily price history by ticker</text>
<text x="46" y="280" font-size="18" fill="#65635c">The description need not mention Apple or last year.</text>
<rect x="28" y="316" width="584" height="100" rx="5" fill="#f0e8db"/>
<text x="46" y="343" font-size="16" fill="#77572c" font-weight="600">Original matching rule</text>
<text x="46" y="372" font-size="22">Match at least 4 of 6 rare terms</text>
<text x="46" y="398" font-size="18" fill="#65635c">Task parameters can cause useful tools to be excluded.</text>
<text x="28" y="475" font-size="17" fill="#65635c">The stock and date range belong in the call parameters.</text>
</g></svg>