<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 638" role="img" aria-labelledby="title"><title id="title">Retrieval, judgment, ranking</title>
<rect width="640" height="100%" fill="#faf9f6"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#292824">
<text x="28" y="45" font-size="24" font-weight="600">Retrieval, judgment, ranking</text>
<rect x="28" y="80" width="584" height="100" rx="5" fill="#eeede8"/>
<text x="46" y="107" font-size="16" fill="#45443f" font-weight="600">01 · Broader retrieval</text>
<text x="46" y="136" font-size="22">Top 30 lexical candidates</text>
<text x="46" y="162" font-size="18" fill="#65635c">Match any rare term in the query.</text>
<rect x="28" y="198" width="584" height="100" rx="5" fill="#e6eeea"/>
<text x="46" y="225" font-size="16" fill="#30594a" font-weight="600">02 · Jev judgment</text>
<text x="46" y="254" font-size="22">30 questions in one request</text>
<text x="46" y="280" font-size="18" fill="#65635c">Does each tool fit the task and required source?</text>
<rect x="28" y="316" width="584" height="100" rx="5" fill="#e6eeea"/>
<text x="46" y="343" font-size="16" fill="#30594a" font-weight="600">03 · Filter and rank</text>
<text x="46" y="372" font-size="22">Below 0.4: discard · At least 0.7: prioritize</text>
<text x="46" y="398" font-size="18" fill="#65635c">Preserve lexical order within each score group.</text>
<rect x="28" y="434" width="584" height="100" rx="5" fill="#f0e8db"/>
<text x="46" y="461" font-size="16" fill="#77572c" font-weight="600">Fallback</text>
<text x="46" y="490" font-size="22">Use the original lexical results</text>
<text x="46" y="516" font-size="18" fill="#65635c">If judgment times out, fails, or is not configured.</text>
<text x="28" y="593" font-size="17" fill="#65635c">Existing reliability and price adjustments still apply.</text>
</g></svg>